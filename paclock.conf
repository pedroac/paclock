# paclock settings: "key = value", '#' starts a comment. Everything has a default.
#
# Read from /etc/pac/paclock.conf, then from the user's
# ~/.config/pac/paclock.conf (or $XDG_CONFIG_HOME/pac/paclock.conf), then from paclock.conf
# in the current folder, each overriding the earlier. With --config FILE only that file is read. Command-line options override all.

# ---- look: the same in all the pac tools ----

# normal, or high for black and white with nothing dimmed.
#contrast = normal

# Makes all text larger or smaller, from 0.5 to 2.5. At 1 the text is the same real size on every
# screen (the password is about 12 mm high), from the size the screen reports; a screen that does
# not say gets text in proportion to its height instead.
#text_scale = 1

# Limits on the smallest text on the card, whatever the screen and text_scale (and resources = minimal) make
# it. A number with a unit: mm, in and pt are real sizes, worked out from what the screen says its size
# is (96 dpi if it says nothing believable); px is logical pixels (which are not a real size); % is of the screen's shorter side.
# If the minimum is above the maximum, the minimum wins. Without them the size is not limited.
#text_size_min = 3mm
#text_size_max = 12mm

# Font files, instead of Noto Sans or DejaVu Sans found in the system font directories.
# font = /usr/share/fonts/TTF/MyFont.ttf
# font_light = /usr/share/fonts/TTF/MyFont-Light.ttf

# The language of the texts, e.g. en or en_US (or a list, "en_US:en"), instead of the one the
# environment (LANGUAGE, LC_ALL, LC_MESSAGES, LANG) asks for. A text with no translation is
# shown in English. Needs that language's locale to be generated on the system (locale-gen).
# language = pt

# Speak the messages aloud, for people who cannot see the screen: the password field, errors,
# "Checking…", Caps Lock, the keyboard layout, where Tab has moved to, and "Unlocked", which is
# only said, never shown. Never the password. Needs speech-dispatcher
# running; without it paclock says so and carries on in silence. Does nothing in a build with
# SPEECH=none.
#speech = yes

# ---- the rest of the session while locked ----
# Each is off when this file does not say so, is done once the screen is locked and undone once it is unlocked, and
# runs a program (busctl, pactl); a missing one is said on stderr and skipped. None is done by
# --demo, which locks nothing. If paclock is killed the screen stays locked, and so does what was
# done: unmute with pactl, or play the player.

# Tell logind the session is locked (Session.LockedHint), for whatever listens to it.
# lock_hint = yes

# Pause the media players (MPRIS) that are playing, and play them again on unlocking.
# pause_players = yes

# Mute the sound of other programs, but not speech-dispatcher's, so the speech above is still
# heard. A stream that starts while locked is not muted; one muted already stays so.
# mute_streams = yes

# ---- what the lock shows ----

# Keyboard layouts to choose from, besides the compositor's own: "pt", "us(intl)". Without
# this every layout xkeyboard-config knows is offered. The compositor's layout is shown under
# the password and followed until another is picked: Tab, then type to search (Left and Right
# step through the matches, Enter picks one, Esc or Tab leaves), or Ctrl+Space (or Super+Space)
# for the next one, Shift added for the previous. Not shown when there is only one.
# layouts = pt, us(intl)
# (Ignored by a build made with LAYOUTS=0, which has no choice of layout.)

# Show the username above the password. Anybody at the screen can read it: it is off by
# default.
# show_user = false

# How much memory paclock may use (also set once for every pac tool in pac.conf):
#   normal   everything
#   low      no username and no choice of keyboard layout (nothing is loaded or drawn for them);
#            the card keeps its size; text is drawn as outlines, not through Cairo's glyph cache
#            (about 260 kB less memory; the glyphs are not hinted)
#   minimal  the same, with a small card: only the password line and what is said under it
#            (denial, Caps Lock), about half the pixels (0.7 times, each way) and less memory. Everything
#            is smaller (text_scale still applies), and only one font file is loaded (font_light is
#            ignored). The show_user and layouts settings are ignored.
# A level never changes contrast, speech or the text size limits: with text_size_min the minimal
# card is larger than it would be.
# resources = normal

# How much paclock shows, and leaks, about you and the screen (also set once for every pac tool
# in pac.conf). Each level includes the ones before it:
#   normal    as in the other settings
#   medium    pauses the media players and mutes other programs' sound while locked, as
#             pause_players and mute_streams do (those, when set, beat the level)
#   high      shows nothing it does not need: no username, no choice of keyboard layout, and no
#             password field. The screen asks "Enter your password"; the field appears when the
#             first key is pressed. What is said when something goes wrong (a refused password,
#             Caps Lock, "Checking...") stays.
#   paranoid  also keeps the length of the password from showing: the field shows a full row of
#             dots whether one key or twenty were pressed (and none while it is empty). Until the first
#             key, a note under the prompt says "Press Enter when done. The length is not shown.",
#             so that the screen is not taken for broken
# Never changes contrast or speech. Without a keyboard layout choice, the compositor's own keys
# are the only way to switch layout.
# Privacy wins over resources: medium runs busctl and pactl, and high and paranoid draw as above,
# at every resources level, minimal included (a person who asks for privacy, or a company policy,
# gets it whatever the memory).
# privacy = normal
